[package]
name = "modern-explorer-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
md-5 = "0.10"
crc32fast = "1.4"
regex = "1.11"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
walkdir = "2.5"
sysinfo = "0.32"
dirs = "5.0"
rand = "0.8"
filetime = "0.2"
open = "5.3"

ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico", "tiff", "gif"] }
sevenz-rust = "0.6"
lzma-rs = "0.3"
ruzstd = "0.7"
lopdf = "0.34"
aes-gcm = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
serde_yaml = "0.9"
toml = "0.8"
csv = "1.3"
qrcodegen = "1.8"
notify = "6.1"

[dev-dependencies]
tempfile = "3.13"



name: Rust Multi-OS Release & Installer Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Semantic Version release tag (MAJOR.MINOR.PATCH, e.g. v1.9.14)'
        required: true
        default: 'v1.9.14'

permissions:
  contents: write

jobs:
  build-rust-windows:
    name: Build Rust Windows (x64 & ARM64 Portable + Setup.exe Installers)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (x64 & ARM64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Run Rust Core Unit Tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Build Rust Windows x64 & ARM64 Portable + Inno Setup Installers
        shell: pwsh
        run: |
          $rawTag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          $version = $rawTag.TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version) -or $version -notmatch '^\d+\.\d+\.\d+') { $version = "1.9.14" }

          New-Item -ItemType Directory -Force -Path dist-rust | Out-Null
          $distFull = (Resolve-Path dist-rust).Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          $targets = @(
            @{ Target = "x86_64-pc-windows-msvc"; Rid = "win-x64"; ArchLabel = "windows-x64" },
            @{ Target = "aarch64-pc-windows-msvc"; Rid = "win-arm64"; ArchLabel = "windows-arm64" }
          )

          foreach ($t in $targets) {
            cargo build --manifest-path rust/Cargo.toml --release --target $($t.Target)
            $exePath = "rust/target/$($t.Target)/release/ModernExplorer-Rust.exe"

            # 1. Standalone Portable .exe
            Copy-Item $exePath -Destination "$distFull/ModernExplorer-Rust-$($t.ArchLabel)-Portable.exe" -Force

            # 2. Portable .zip Archive (with Assets & README)
            $stageDir = Join-Path $distFull "stage-$($t.Rid)"
            New-Item -ItemType Directory -Force -Path "$stageDir/Assets" | Out-Null
            Copy-Item $exePath -Destination "$stageDir/ModernExplorer-Rust.exe" -Force
            Copy-Item "rust/modern-explorer-app/assets/AppIcon.ico" -Destination "$stageDir/Assets/AppIcon.ico" -Force
            Copy-Item "rust/modern-explorer-app/assets/AppIcon.png" -Destination "$stageDir/Assets/AppIcon.png" -Force
            Set-Content -Path "$stageDir/README-Portable.txt" -Value "ModernExplorer Studio v$version (Rust Edition - $($t.ArchLabel) Portable)`r`nStart ModernExplorer-Rust.exe directly without installation." -Encoding UTF8
            Compress-Archive -Path "$stageDir/*" -DestinationPath "$distFull/ModernExplorer-Rust-$($t.ArchLabel)-Portable.zip" -Force

            # 3. Inno Setup Windows Installer (.exe)
            $stageAbs = (Resolve-Path $stageDir).Path
            & $iscc "/DAppVersion=$version" "/DTargetRid=$($t.Rid)" "/DSourceDir=$stageAbs" "/DOutputDir=$distFull" "installers/rust/ModernExplorer-Rust.iss"
            Remove-Item $stageDir -Recurse -Force
          }

      - name: Upload Rust Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-windows-releases
          path: |
            dist-rust/*.zip
            dist-rust/*.exe

  build-rust-linux:
    name: Build Rust Linux (${{ matrix.arch_id }} Portable + .deb + .rpm + Arch + .AppImage + .sh)
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch_id: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch_id: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies (GTK3, WebKit2GTK 4.1, RPM, Zstandard)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            zstd \
            zip

      - name: Install Rust Toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Rust Linux Binary & Multi-Distro Installers
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then VERSION="1.9.7"; fi

          cargo build --manifest-path rust/Cargo.toml --release --target ${{ matrix.target }}

          mkdir -p dist-rust
          sed -i 's/\r$//' installers/rust/build-linux-rust-installers.sh
          chmod +x installers/rust/build-linux-rust-installers.sh
          ./installers/rust/build-linux-rust-installers.sh \
            "${{ matrix.arch_id }}" \
            "${VERSION}" \
            "$(pwd)/rust/target/${{ matrix.target }}/release/ModernExplorer-Rust" \
            "$(pwd)/rust/modern-explorer-app/assets/AppIcon.png" \
            "$(pwd)/dist-rust"

      - name: Upload Rust Linux ${{ matrix.arch_id }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-linux-releases-${{ matrix.arch_id }}
          path: |
            dist-rust/*.tar.gz
            dist-rust/*.zip
            dist-rust/*.AppImage
            dist-rust/*.deb
            dist-rust/*.rpm
            dist-rust/*.pkg.tar.zst
            dist-rust/*.sh

  build-rust-macos:
    name: Build Rust macOS (${{ matrix.arch_id }} Portable + .dmg + .pkg Installer)
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch_id: macos-x64
            target: x86_64-apple-darwin
          - arch_id: macos-arm64
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Rust macOS Binary, Portable .app Bundles & .dmg/.pkg Installers
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then VERSION="1.9.7"; fi

          cargo build --manifest-path rust/Cargo.toml --release --target ${{ matrix.target }}

          mkdir -p dist-rust
          sed -i '' 's/\r$//' installers/rust/build-macos-rust-installers.sh || true
          chmod +x installers/rust/build-macos-rust-installers.sh
          ./installers/rust/build-macos-rust-installers.sh \
            "${{ matrix.arch_id }}" \
            "${VERSION}" \
            "$(pwd)/rust/target/${{ matrix.target }}/release/ModernExplorer-Rust" \
            "$(pwd)/rust/modern-explorer-app/assets/AppIcon.png" \
            "$(pwd)/dist-rust"

      - name: Upload Rust macOS ${{ matrix.arch_id }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-macos-releases-${{ matrix.arch_id }}
          path: |
            dist-rust/*.zip
            dist-rust/*.tar.gz
            dist-rust/*.dmg
            dist-rust/*.pkg

  publish-github-release:
    name: Publish GitHub Release (Rust Edition)
    needs: [build-rust-windows, build-rust-linux, build-rust-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Release Notes
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          $lines = @(
            "## What's New in Modern Explorer Studio $tag (Rust Edition)",
            '',
            "### ModernExplorer Studio (Rust Edition) Updates in $tag",
            '- **Image Preview & Hover Card Protocol Fix (v1.9.21):** Fixed broken image previews across the application (hover preview cards on left and right explorer panes, right dock preview inspector, thumbnail grid views, and quick viewers). On Windows WebView2, custom URI schemes map to `http://<scheme>.localhost/` rather than `<scheme>://localhost/`. Updated image URL generation to dynamically resolve to `http://file-preview.localhost/` on Windows with full CORS headers and preflight (OPTIONS) support, and implemented an automatic fallback to base64 data URLs via dedicated `image_preview` RPC, ensuring instant, flawless image rendering for all standard image formats (.png, .jpg, .webp, .avif, .gif, .svg, .bmp, .ico, .tiff) and virtual archive files.',
            '- **Per-Tab Column Sorting Persistence in Saved Sessions (v1.9.20):** Fixed an issue where column sorting (Name, Size, Modified, Extension, and Ascending/Descending direction) in Details view mode was reset to default on application restart. Each tab in both left and right explorer panes now independently tracks, serializes (`sort_column`, `sort_ascending`), and restores its specific sort column and sort order across sessions and workspace profiles. Restored tabs automatically synchronize their column header sort indicators (▲/▼) in the UI, and tab duplication now preserves the exact sort state.',
            '- **Bidirectional Translation & Language-Switch Fix (v1.9.19):** Resolved an issue where switching the UI to Japanese or Chinese and then back to German or another language left certain controls and dynamic labels stuck in Japanese or Chinese. Implemented comprehensive in-memory reverse translation mapping (`REVERSE_I18N` with 11,000+ entries) and self-healing DOM translation in `translateElementTree`. Any previously translated label is now automatically resolved to its canonical key and translated into the target language, enabling seamless, artifact-free multi-language switching across all 10 supported languages.',
            '- **Comprehensive Full UI Translation for All Languages (v1.9.18):** Expanded multi-language dictionaries for Japanese (`ja`), Chinese (`zh`), Spanish (`es`), French (`fr`), Italian (`it`), Dutch (`nl`), Polish (`pl`), and Portuguese (`pt`) from sparse stubs (~20 keys) to 1,000+ comprehensively translated UI strings across every control, menu bar, options bar, favorites bar, column headers, right inspector dock, function key bar (F1-F12), status bar, preferences dialog (all 9 categories, options, and descriptions), power tools, and context menus. Implemented unified multi-language mapping in both frontend (`I18N`) and backend (`LocalizationService`), enabling instant reactive DOM translation on language selection without requiring an application restart.',
            '- **Live Progress Dialog for F5 Copy & Virtual Archive Extraction (v1.9.17):** Added dedicated asynchronous background job architecture and modal progress display (`#modalCopyProgress`) for F5 copying and virtual archive extraction. Users now get instant visual feedback with animated striped progress bar, live percentage, processed vs. total item counter, currently extracted/copied file path, destination directory, and non-blocking cancel button, eliminating perceived app freezes during large transfers.',
            '- **Total Commander Style F5 Copy/Unpack from Virtual Archives (v1.9.16):** Fixed F5 copy failing when browsing inside archives (`archive://...`). Implemented selective entry and folder extraction engine (`ArchiveService::extract_virtual_entries`) supporting single files, multiple marked entries, and entire directory hierarchies across ZIP (.zip, .jar, .nupkg), 7z (.7z), and TAR variants (.tar.gz, .tgz, .tar.zst, .tzst, .tar.xz, .txz), unpacking selected files/folders seamlessly into the target explorer pane with full path nesting and duplicate conflict checks.',
            '- **Default Archive Double-Click Action Set to Explorer (v1.9.16):** Set default double-click action on archives (`archive_open_action`) to `"open_in_explorer"` ("Direkt im Explorer öffnen"), allowing users to navigate directly into archives as virtual folders just like regular folders out of the box, with full toggle support in Settings -> "Dateiliste & Verhalten".',
            '- **Non-Blocking Asynchronous Treemap Analysis & Progress Reporting (v1.9.15):** Completely eliminated GUI freezes when opening Treemap on HDD roots and large drives by decoupling scanning from the main Tauri RPC state onto a dedicated background worker thread with atomic progress tracking (`scanned_files`, `scanned_folders`, `current_path`). Added live animated progress bar with file/folder counters and instant cancellation (`Scan abbrechen`).',
            '- **User-Triggered Manual Scan & Clean Initial State (v1.9.15):** Treemap no longer scans immediately upon opening; users can inspect and change the target path, select folders via tree flyout, and trigger the analysis via the prominent "Scan starten" button.',
            '- **Files-Only Default View & Folder Inclusion Toggle (v1.9.15):** Treemap layout now defaults to displaying pure file rectangles proportional to their size without bulky directory containers, matching WinDirStat and SpaceSniffer leaf views. Added a dedicated "Ordner einbeziehen" toolbar checkbox to seamlessly toggle hierarchical directory group containers on demand.',
            '- **Fixed Treemap Button Localization Keys (v1.9.15):** Fixed all Treemap control buttons displaying raw translation keys (such as `tm.reveal_in_tab`, `tm.open_as_tab`, `tm.delete_sel`, `tm.scan_btn`, `tm.zoom_up`, etc.) by fully populating all `tm.*` localization strings across dictionaries.',
            '- **Stabilized Folder & File Color Separation (v1.9.15):** Resolved an issue where customized folder text colors (e.g. green) unexpectedly switched to blue on subfolders. Fixed Windows NTFS `FILE_ATTRIBUTE_READONLY` shell attribute leakage onto folder rows, ensuring folder color always takes precedence over file-only read-only and filetype rules.',
            '- **Complete End-to-End Localization & Multi-Language Coverage (v1.9.14):** Fixed remaining untranslated German strings across all 9 Settings tabs, color rows, file list color targets, live preview simulation, window bounds & dialog sizes table, shortcuts table, cloud backup status & dropdowns, and all context menus (`showContextMenuAt`). Dynamically translated keyboard shortcuts (`Strg` -> `Ctrl`, `Umschalt` -> `Shift`) based on selected language and ensured instant live DOM updates without restarting.',
            '- **Enhanced Side-by-Side PDF & Binary Diff Engine (v1.9.13):** Fixed Side-by-Side File Diff tool (`Ctrl+Shift+U`) swallowing differences between PDF files. Implemented full page-by-page text extraction (`doc.extract_text`) with page separators, automatic PDF structural & metadata fallback (PDF version, page count, media boxes, rotations, object streams, stream filters & lengths, SHA-256) when font text layers are absent or scanned, and automatic binary properties comparison when extracted texts are identical but binaries differ. Added support for general non-UTF-8 encodings (UTF-16 LE/BE, Latin-1, hex dump) and enhanced the Diff modal with swap sides (`⇄`), whitespace toggle, loading states, and multi-file selection support within active panes.',
            '- **Comprehensive Multi-Language Localization System (v1.9.12):** Full end-to-end UI localization covering all 9 Settings tabs, section titles, option cards, form controls, dropdown choices, table headers, buttons, context menus, command palette, shortcuts table, and all 20+ power-tool modals (`showToolModal`). Built a safe, reversible DOM tree localization engine (`translateElementTree`) that preserves original German markup, integrated an expanded 890+ entry dictionary with automatic English fallbacks (`I18N[lang] -> I18N.en -> I18N.de -> raw`), and dynamically localizes on language selection without restart.',
            '- **Cloud Provider Setup & Auto-Detection Fix (v1.9.11):** Fixed Microsoft OneDrive detection status badge bug. Enhanced cloud directory resolver with Windows Registry scanning (`HKCU\Software\Microsoft\OneDrive\Accounts\Personal\UserFolder`, etc.) and multi-drive path resolution for OneDrive, Google Drive, Apple iCloud Drive, Dropbox, and Nextcloud/ownCloud. Added dedicated Cloud Configuration Wizard modal (`Cloud-Speicher einrichten & verbinden`) allowing users to configure custom root paths for all cloud providers, run interactive connection & write tests, select folders via folder browser, and choose the active backup target. Custom provider paths are now persisted in settings (`cloud_provider_paths`).',
            '- **Cloud & Local Settings Backup with Fresh Install Restoration (v1.9.10):** Added comprehensive cloud backup service detecting Microsoft OneDrive, Google Drive, Apple iCloud Drive, Dropbox, and custom user-defined directories. Supports automatic cloud backup on settings change, timestamped and latest-package backups, 1-click cloud restoration modal, and startup cloud backup detection banner on fresh installations. Added separate standalone Color Theme export/import (`.json` and clipboard) preserving all Total Commander style custom colors, zebra stripes, grid lines, and filetype color rules.',
            '- **Keyboard & Arrow Key Navigation to Parent Directory [..] (v1.9.9):** In the Explorer pane, users can now navigate seamlessly onto the parent directory entry (`[..] <UP>`) using `ArrowUp`, `ArrowLeft`, `Home`, and back with `ArrowDown` / `ArrowRight`. Pressing `Enter` on the selected parent entry navigates up immediately, single-click/double-click and context menu are fully wired, and safe boundary guards prevent accidental marking or deletion while parent is selected.',
            '- **Comprehensive Font Size Customization for Settings & Child Dialogs (v1.9.8):** Added dedicated Settings window font size scaling (`settings_window_font_size`) that scales the entire Settings window (`.prefs`, `#modalSettings`, nav items, section titles, rows, controls, and tables) both individually and via Global Font Size (`use_global_font_size`). Added live reactive scaling on slider drag (`updateFontSettingLive`), complete dialog font mapping for all tool windows, and missing script template defaults.',
            '- **Total Commander Color Customization & Rule-Based File-Type Coloring (v1.9.7):** Full Total Commander style color customization in Settings (`Colors & Highlighting`) with 1-click presets (`Modern Studio`, `Total Commander Classic`, `Norton Commander DOS`, `TC Dark Commander`, `Retro Matrix`, `Solarized Commander`), interactive live preview table, customizable file list primary & zebra-stripe backgrounds, grid lines, full-row inverted focus cursor (`invert_cursor`), folder/hidden/readonly text colors, and prioritized rule-based coloring by file mask & file age (`FileTypeColorRule`).',
            '- **Expanded Preferences, Natural Sorting, External Tools & JSON Backup (v1.9.7):** Added UI bar visibility toggles (Drive Bar, Favorites Bar, Left Tool Rail, Breadcrumbs, F1–F12 Bar, Status Bar, Startup Folder Tree, UI Zoom 75%–160%), Natural Number Sorting (`natural_number_sorting`), customizable size (`dynamic`/`bytes`/`kb`/`mb`) and date/time formats, `[..]` parent folder toggle, Total Commander keyboard/mouse ergonomics (`space_moves_down_on_mark`, double-click empty space goes up, middle-click opens tab, overwrite confirmation), external `F4` editor / diff tool / `F9` terminal configuration, Power-Tool defaults, and 1-click Settings JSON Export/Import.',
            '- **Native Self-Replace In-Place Updater (v1.9.6):** Direct binary replacement using a lightweight detached background updater script (`update-self-replace.bat` on Windows, POSIX shell script on Linux/macOS) with robust retry loop and automatic application restart without requiring external Inno Setup or elevated UAC installer steps.',
            '- **Tauri v2 Migration (v1.9.6):** Migrated `modern-explorer-app` to standard Tauri v2 architecture, providing modernized cross-platform WebView runtime, unified IPC invoke routing, and clean custom asset/preview protocols while preserving all 20+ power tools, settings persistence, and native capabilities.',
            '- **Archive Double-Click Action & Virtual Folder Navigation (v1.9.6):** Added configurable double-click action (`archive_open_action`: `archive_browser` vs. `open_in_explorer`) allowing users to browse archives directly inside explorer panes as virtual folders (`archive://...`), complete with breadcrumbs, subfolder navigation, quick preview extraction, and context menus.',
            '- **Smart Dual-Pane Folder Sync Jump (v1.9.6):** Added configurable pane sync jump (`sync_jump_to_other_pane_folder`). Clicking a folder in one explorer pane automatically switches to the other pane if that folder is already active in one of its tabs, preventing redundant tab duplication and speeding up dual-pane workflows.',
            '- **Self-Updater Execution & Restart Fix (v1.9.5):** Fixed Windows PowerShell encoding and quote parsing issues in the updater script by enforcing UTF-8 BOM encoding and pure ASCII delimiters. Added robust retry loops, detailed updater logging (`update.log`), proper Inno Setup installer execution (`/SILENT`), and automatic application restart.',
            '- **Automatic Startup Update Check & One-Click Self-Updater:** Fixed HTTPS TLS configuration (`ureq` with `tls`) for GitHub Release checks, added automatic update detection on application startup (`check_updates_on_startup`) with top-bar badge notification, and implemented one-click in-place self-updating (`install_update`) with progress feedback.',
            '- **Full Keyboard Navigation & Type-Ahead Quick Search in Explorer Panes:** Navigate seamlessly through files and folders using Arrow keys (`Up`, `Down`, `Left`, `Right`), `Home`, `End`, `PageUp`, `PageDown`, `Shift+Arrow` range selection, `Insert` (mark & move down), `Space` (mark), `Ctrl+A` (mark all), and Windows Explorer / Total Commander style type-ahead quick search (`⚡ Suche` pill, single-character cycling, prefix & substring matching, and `Backspace` editing) across all 8 view modes.',
            '- **Resizable, Draggable & Maximizable Child Windows with Session Persistence:** All child windows and tool dialogs feature 8-way resize handles, draggable headers, and maximize/restore controls, saving their exact bounds per dialog across sessions (`dialog_sizes` in `settings.json`).',
            '- **Full 14-Language Live Localization (`I18N`):** Instant live switching across all 14 supported languages without restart across menus, toolbars, column headers, inspector dock, settings, context menus, and all 20 power tools.',
            '- **Interactive Squarified Storage Treemap (`Ctrl+Shift+W`):** Interactive drive/folder selector with expandable folder tree flyout, upper split view (`Folder Hierarchy` / `Top 100 Largest Files` + `Extension Statistics`), and lower interactive Squarified Treemap canvas (`Category` & `File Age Heatmap` modes, double-click zoom/drilldown, context menu, delete, and Markdown/CSV report export).',
            '- **Minimizable & Resizable Right Inspector Dock (`Ctrl+Q`) & Multi-Line Drive Bar:** The right Inspector Dock can be minimized to a slim 28px vertical bar or resized (`210px-640px`), and the Drive Bar supports automatic multi-line wrapping (`multiline_drive_bar`).',
            '- **Exact Main Window Restore from Maximize, Native App Icon & `Alt+F7` Deep Search Fix:**',
            '  - Restoring from Maximize after manually stretching the main window to the full monitor work area restores the exact manual top position (`y = 0`) and height without losing a titlebar height at the top.',
            '  - Embedded official `AppIcon.ico` / `AppIcon.png` into the native Windows executable (`rc.exe`), native window & taskbar icons (`WindowBuilder`), and Studio UI.',
            '  - Fixed `Alt+F7` shortcut so it opens Recursive Deep Search instead of triggering the `F7` create dialog.',
            '',
            '### Available Multi-OS Packages (Rust Edition - Portable & Installers)',
            '- **Windows (`x64` & `ARM64`):** Portable `.exe`, Portable `.zip`, and Inno Setup 6 Installer (`ModernExplorer-Rust-Setup-win-x64.exe`, `ModernExplorer-Rust-Setup-win-arm64.exe`)',
            '- **macOS (`Intel x64` & `Apple Silicon arm64`):** Portable `.app` (`.zip` / `.tar.gz`), `.dmg` Disk Image, and `.pkg` Installer',
            '- **Linux (`x64` & `ARM64`):** Portable `.tar.gz`, `.zip`, `.AppImage`, Debian/Ubuntu `.deb`, Fedora/RHEL/openSUSE `.rpm`, Arch Linux `.pkg.tar.zst`, and universal `.sh` Installer'
          )
          $notes = $lines -join "`n"
          Set-Content -Path "release-notes.md" -Value $notes -Encoding UTF8

      - name: Download all Rust artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create & Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Modern Explorer Studio ${{ github.event.inputs.tag_name || github.ref_name }} (Rust Edition)
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            release-assets/ModernExplorer-Rust-*



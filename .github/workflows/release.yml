name: Multi-OS Release & Installer Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Semantic Version release tag (MAJOR.MINOR.PATCH, e.g. v1.8.1)'
        required: true
        default: 'v1.8.1'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Zip + Setup.exe Installers)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run unit tests
        run: dotnet test tests/ModernExplorer.Core.Tests/ModernExplorer.Core.Tests.csproj -c Release

      - name: Build Windows x64, ARM64, and x86 + Compile Inno Setup Installers
        shell: pwsh
        run: |
          $rawTag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          $version = $rawTag.TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version) -or $version -notmatch '^\d+\.\d+\.\d+') { $version = "1.6.0" }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $distFull = (Resolve-Path dist).Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          # 1. Windows x64 (WinUI 3 - Self-Contained .NET 9 + Windows App SDK + VC++ CRT)
          dotnet build src/ModernExplorer.App/ModernExplorer.App.csproj -c Release -p:Platform=x64 -r win-x64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true -p:WindowsAppSDKBootstrapAutoInitializeOptions_None=true -p:Version=$version
          $x64Dir = (Resolve-Path "src/ModernExplorer.App/bin/x64/Release/net9.0-windows10.0.19041.0/win-x64").Path
          Remove-Item "$x64Dir/Microsoft.WindowsAppRuntime.Bootstrap*.dll" -Force -ErrorAction SilentlyContinue
          $vcDlls64 = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "concrt140.dll", "vccorlib140.dll")
          foreach ($dll in $vcDlls64) {
              $srcDll = Join-Path $env:SystemRoot "System32\$dll"
              if (Test-Path $srcDll) { Copy-Item $srcDll -Destination $x64Dir -Force }
          }
          Compress-Archive -Path "$x64Dir/*" -DestinationPath "$distFull/ModernExplorer-windows-x64.zip" -Force
          & $iscc "/DAppVersion=$version" "/DTargetRid=win-x64" "/DSourceDir=$x64Dir" "/DOutputDir=$distFull" "installers/windows/ModernExplorer.iss"

          # 2. Windows ARM64 (WinUI 3 - Self-Contained .NET 9 + Windows App SDK)
          dotnet build src/ModernExplorer.App/ModernExplorer.App.csproj -c Release -p:Platform=ARM64 -r win-arm64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true -p:WindowsAppSDKBootstrapAutoInitializeOptions_None=true -p:Version=$version
          $arm64Dir = (Resolve-Path "src/ModernExplorer.App/bin/ARM64/Release/net9.0-windows10.0.19041.0/win-arm64").Path
          Remove-Item "$arm64Dir/Microsoft.WindowsAppRuntime.Bootstrap*.dll" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$arm64Dir/*" -DestinationPath "$distFull/ModernExplorer-windows-arm64.zip" -Force
          & $iscc "/DAppVersion=$version" "/DTargetRid=win-arm64" "/DSourceDir=$arm64Dir" "/DOutputDir=$distFull" "installers/windows/ModernExplorer.iss"

          # 3. Windows x86 (CrossPlatform Desktop - Self-Contained .NET 9 + VC++ CRT)
          dotnet publish src/ModernExplorer.CrossPlatform/ModernExplorer.CrossPlatform.csproj -c Release -r win-x86 --self-contained true -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:Version=$version -o publish/win-x86
          $x86Dir = (Resolve-Path "publish/win-x86").Path
          $vcDlls86 = @("vcruntime140.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "concrt140.dll", "vccorlib140.dll")
          foreach ($dll in $vcDlls86) {
              $srcDll86 = Join-Path $env:SystemRoot "SysWOW64\$dll"
              if (Test-Path $srcDll86) { Copy-Item $srcDll86 -Destination $x86Dir -Force }
          }
          Compress-Archive -Path "$x86Dir/*" -DestinationPath "$distFull/ModernExplorer-windows-x86.zip" -Force
          & $iscc "/DAppVersion=$version" "/DTargetRid=win-x86" "/DSourceDir=$x86Dir" "/DOutputDir=$distFull" "installers/windows/ModernExplorer.iss"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-releases
          path: |
            dist/*.zip
            dist/*.exe

  build-linux:
    name: Build Linux (${{ matrix.rid }} Zip + .deb + .sh Installer)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish & Build Linux Installers (.deb & .sh)
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then VERSION="1.6.0"; fi

          mkdir -p dist
          dotnet publish src/ModernExplorer.CrossPlatform/ModernExplorer.CrossPlatform.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:SelfContained=true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:Version="${VERSION}" \
            -o publish/${{ matrix.rid }}

          (cd publish/${{ matrix.rid }} && zip -r ../../dist/ModernExplorer-${{ matrix.rid }}.zip .)

          sed -i 's/\r$//' installers/linux/build-linux-installers.sh
          chmod +x installers/linux/build-linux-installers.sh
          ./installers/linux/build-linux-installers.sh \
            "${{ matrix.rid }}" \
            "${VERSION}" \
            "$(pwd)/publish/${{ matrix.rid }}" \
            "$(pwd)/src/ModernExplorer.App/Assets/AppIcon.png" \
            "$(pwd)/dist"

      - name: Upload Linux ${{ matrix.rid }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-releases-${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.deb
            dist/*.sh

  build-macos:
    name: Build macOS (${{ matrix.rid }} Zip + .dmg + .pkg Installer)
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-x64, osx-arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish & Build macOS Installers (.dmg & .pkg)
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then VERSION="1.6.0"; fi

          mkdir -p dist
          dotnet publish src/ModernExplorer.CrossPlatform/ModernExplorer.CrossPlatform.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:SelfContained=true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:Version="${VERSION}" \
            -o publish/${{ matrix.rid }}

          (cd publish/${{ matrix.rid }} && zip -r ../../dist/ModernExplorer-${{ matrix.rid }}.zip .)

          sed -i '' 's/\r$//' installers/macos/build-macos-installers.sh || true
          chmod +x installers/macos/build-macos-installers.sh
          ./installers/macos/build-macos-installers.sh \
            "${{ matrix.rid }}" \
            "${VERSION}" \
            "$(pwd)/publish/${{ matrix.rid }}" \
            "$(pwd)/src/ModernExplorer.App/Assets/AppIcon.png" \
            "$(pwd)/dist"

      - name: Upload macOS ${{ matrix.rid }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-releases-${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.pkg

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract latest release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          $changelogSection = ""
          if (Test-Path "CHANGELOG.md") {
            $rawChangelog = Get-Content "CHANGELOG.md" -Raw -Encoding UTF8
            $match = [regex]::Match($rawChangelog, '(?ms)^## \[[^\r\n]+\r?\n(.+?)(?=\r?\n---\r?\n|\z)')
            if ($match.Success) {
              $changelogSection = $match.Groups[1].Value.Trim()
              $changelogSection = [regex]::Replace($changelogSection, '\[([^\]]+)\]\(file:///[^)]+\)', '$1')
            }
          }
          if (-not [string]::IsNullOrWhiteSpace($changelogSection)) {
            $notes = "## What's New in Modern Explorer $tag`n`n$changelogSection"
          } else {
            $notes = "## What's New in Modern Explorer $tag`n`nMulti-OS release of Modern Explorer $tag."
          }
          Set-Content -Path "release-notes.md" -Value $notes -Encoding UTF8

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create & Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Modern Explorer ${{ github.event.inputs.tag_name || github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.deb
            release-assets/*.sh
            release-assets/*.dmg
            release-assets/*.pkg

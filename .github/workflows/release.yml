name: Multi-OS Release & Installer Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Semantic Version release tag (MAJOR.MINOR.PATCH, e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Zip + Setup.exe Installers)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run unit tests
        run: dotnet test tests/ModernExplorer.Core.Tests/ModernExplorer.Core.Tests.csproj -c Release

      - name: Build Windows x64, ARM64, and x86 + Compile Inno Setup Installers
        shell: pwsh
        run: |
          $rawTag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          $version = $rawTag.TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version) -or $version -notmatch '^\d+\.\d+\.\d+') { $version = "1.5.0" }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $distFull = (Resolve-Path dist).Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          # 1. Windows x64 (WinUI 3 - Self-Contained .NET 9 + Windows App SDK)
          dotnet build src/ModernExplorer.App/ModernExplorer.App.csproj -c Release -p:Platform=x64 -r win-x64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true -p:Version=$version
          $x64Dir = (Resolve-Path "src/ModernExplorer.App/bin/x64/Release/net9.0-windows10.0.19041.0/win-x64").Path
          Compress-Archive -Path "$x64Dir/*" -DestinationPath "$distFull/ModernExplorer-windows-x64.zip" -Force
          & $iscc "/DAppVersion=$version" "/DTargetRid=win-x64" "/DSourceDir=$x64Dir" "/DOutputDir=$distFull" "installers/windows/ModernExplorer.iss"

          # 2. Windows ARM64 (WinUI 3 - Self-Contained .NET 9 + Windows App SDK)
          dotnet build src/ModernExplorer.App/ModernExplorer.App.csproj -c Release -p:Platform=ARM64 -r win-arm64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true -p:Version=$version
          $arm64Dir = (Resolve-Path "src/ModernExplorer.App/bin/ARM64/Release/net9.0-windows10.0.19041.0/win-arm64").Path
          Compress-Archive -Path "$arm64Dir/*" -DestinationPath "$distFull/ModernExplorer-windows-arm64.zip" -Force
          & $iscc "/DAppVersion=$version" "/DTargetRid=win-arm64" "/DSourceDir=$arm64Dir" "/DOutputDir=$distFull" "installers/windows/ModernExplorer.iss"

          # 3. Windows x86 (CrossPlatform Desktop - Self-Contained)
          dotnet publish src/ModernExplorer.CrossPlatform/ModernExplorer.CrossPlatform.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:Version=$version -o publish/win-x86
          $x86Dir = (Resolve-Path "publish/win-x86").Path
          Compress-Archive -Path "$x86Dir/*" -DestinationPath "$distFull/ModernExplorer-windows-x86.zip" -Force
          & $iscc "/DAppVersion=$version" "/DTargetRid=win-x86" "/DSourceDir=$x86Dir" "/DOutputDir=$distFull" "installers/windows/ModernExplorer.iss"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-releases
          path: |
            dist/*.zip
            dist/*.exe

  build-linux:
    name: Build Linux (${{ matrix.rid }} Zip + .deb + .sh Installer)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish & Build Linux Installers (.deb & .sh)
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then VERSION="1.5.0"; fi

          mkdir -p dist
          dotnet publish src/ModernExplorer.CrossPlatform/ModernExplorer.CrossPlatform.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:Version="${VERSION}" \
            -o publish/${{ matrix.rid }}

          (cd publish/${{ matrix.rid }} && zip -r ../../dist/ModernExplorer-${{ matrix.rid }}.zip .)

          sed -i 's/\r$//' installers/linux/build-linux-installers.sh
          chmod +x installers/linux/build-linux-installers.sh
          ./installers/linux/build-linux-installers.sh \
            "${{ matrix.rid }}" \
            "${VERSION}" \
            "$(pwd)/publish/${{ matrix.rid }}" \
            "$(pwd)/src/ModernExplorer.App/Assets/AppIcon.png" \
            "$(pwd)/dist"

      - name: Upload Linux ${{ matrix.rid }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-releases-${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.deb
            dist/*.sh

  build-macos:
    name: Build macOS (${{ matrix.rid }} Zip + .dmg + .pkg Installer)
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-x64, osx-arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish & Build macOS Installers (.dmg & .pkg)
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then VERSION="1.5.0"; fi

          mkdir -p dist
          dotnet publish src/ModernExplorer.CrossPlatform/ModernExplorer.CrossPlatform.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:Version="${VERSION}" \
            -o publish/${{ matrix.rid }}

          (cd publish/${{ matrix.rid }} && zip -r ../../dist/ModernExplorer-${{ matrix.rid }}.zip .)

          sed -i '' 's/\r$//' installers/macos/build-macos-installers.sh || true
          chmod +x installers/macos/build-macos-installers.sh
          ./installers/macos/build-macos-installers.sh \
            "${{ matrix.rid }}" \
            "${VERSION}" \
            "$(pwd)/publish/${{ matrix.rid }}" \
            "$(pwd)/src/ModernExplorer.App/Assets/AppIcon.png" \
            "$(pwd)/dist"

      - name: Upload macOS ${{ matrix.rid }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-releases-${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.pkg

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create & Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Modern Explorer ${{ github.event.inputs.tag_name || github.ref_name }}
          body: |
            ## What's New in Modern Explorer ${{ github.event.inputs.tag_name || github.ref_name }}

            ### Changelog
            - **Explorer-Tree Dropdown in Storage Analyzer:** Added an interactive `🌳 Explorer-Baum ▾` dropdown next to the drive/directory path box in the Storage Analyzer (`Ctrl+Shift+W`), displaying all mounted drives (with free/total capacity) and expandable folder hierarchies for direct one-click selection and scanning.
            - **Multi-Selection (`Ctrl+Click`), Right-Click Context Menu Delete & `Delete` (`Entf`) Key in Storage Analyzer:** Select single or multiple graphical tiles in the Squarified Treemap (and hierarchy list) using `Ctrl+Click`, and delete selected files/folders via the right-click context menu (`🗑 ... löschen [Entf]`) or by pressing the `Delete` (`Entf`) key with instant in-place Treemap recalculation.
            - **Customizable Treemap Category Colors in Settings:** Customize all 7 file category colors used by the Storage Analyzer Treemap in **Settings -> Colors & Themes** with preset palettes, hex inputs, live preview swatches, and one-click reset.
            - **Per-Child-Window Font Size & Global Font Size Checkbox in Settings:** Configure individual font sizes for every Child Window (Quick-Viewer, Editor, Storage Analyzer, Deep Search, Duplicate Finder, Directory Sync, Multi-Rename, FTP/SFTP Manager, Archive Dialog, About Window) or enable the **Global Font Size** checkbox to control the entire app and all child windows with a single slider.
            - **100% Self-Contained Installers (All Runtimes Included):** All Windows (`win-x64`, `win-arm64`, `win-x86`), Linux (`linux-x64`, `linux-arm64`), and macOS (`osx-x64`, `osx-arm64`) installers and archives now bundle both the complete .NET 9 runtime and the Windows App SDK / native UI libraries (`SelfContained=true` & `WindowsAppSDKSelfContained=true`), requiring zero external runtime downloads.
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.deb
            release-assets/*.sh
            release-assets/*.dmg
            release-assets/*.pkg

